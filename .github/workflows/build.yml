name: Build & Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Lint PHP files
        run: |
          echo "=== Validating PHP syntax ==="
          errors=0
          while IFS= read -r file; do
            if ! php -l "$file" 2>&1 | grep -q "No syntax errors"; then
              echo "FAIL: $file"
              php -l "$file"
              errors=$((errors + 1))
            fi
          done < <(find wp-content/ -name "*.php" -type f)
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors PHP file(s) with syntax errors"
            exit 1
          fi
          echo "All PHP files passed syntax check"

      - name: Validate JSON templates
        run: |
          echo "=== Validating JSON templates ==="
          errors=0
          while IFS= read -r file; do
            if python3 -c "import json; json.load(open('$file'))" 2>/dev/null; then
              echo "OK: $file"
            else
              echo "FAIL: $file"
              errors=$((errors + 1))
            fi
          done < <(find wp-content/ -name "*.json" -type f)
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors JSON file(s) with errors"
            exit 1
          fi
          echo "All JSON files are valid"

      - name: Build theme ZIP
        run: |
          mkdir -p dist
          cd wp-content/themes
          zip -r ../../dist/guebel-theme.zip guebel/

      - name: Build core plugin ZIP
        run: |
          cd wp-content/plugins
          zip -r ../../dist/guebel-core.zip guebel-core/

      - name: Build setup plugin ZIP
        run: |
          cd wp-content/plugins
          zip -r ../../dist/guebel-setup.zip guebel-setup/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guebel-dist
          path: dist/
          retention-days: 30

  release:
    needs: validate-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: guebel-dist
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/guebel-theme.zip
            dist/guebel-core.zip
            dist/guebel-setup.zip
          generate_release_notes: true
